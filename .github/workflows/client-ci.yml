name: Client CI (lint & build)

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    paths:
      - "client/**"

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and prepare assets
        working-directory: .
        run: |
          set -euo pipefail
          echo "Downloading assets.zip..."
          curl -L "https://create-rington.com/api/download/assets?code=${{ secrets.DOWNLOAD_ACCESS_CODE }}" -o assets.zip

          echo "Copying assets.zip to server/app/routes/download/"
          mkdir -p server/app/routes/download
          cp assets.zip server/app/routes/download/assets.zip

          echo "Unzipping assets into client/src/assets for Vite"
          mkdir -p client/src/assets
          unzip -o assets.zip -d client/src/assets

          echo "Cleaning up temporary zip..."
          rm assets.zip

      - name: Use Node.js 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload dist
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
